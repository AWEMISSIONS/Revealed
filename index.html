0 18px;flex-wrap:wrap}.story-tools button{font-size:13px}.hint{color:#bbc7d8;font-size:13px}.art{min-height:170px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#8e704e,#26344c 55%,#10192a);font-size:76px}.inner{padding:23px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#f6c76d;text-transform:uppercase;font-weight:700}h2{font-size:27px;line-height:1.2;margin:12px 0} .option{display:block;width:100%;text-align:left;padding:15px;border:1px solid #495770;background:#1a2940;color:#fff;border-radius:14px;margin:10px 0}.option:hover{background:#2d415d}.option:disabled{cursor:default;opacity:.7}.correct{border-color:#7ad6a3;background:#194738!important;opacity:1!important}.wrong{border-color:#ff9393;background:#4b2633!important;opacity:1!important}.reveal{background:#101d2f;border-left:3px solid #f6c76d;padding:14px;margin-top:16px;border-radius:8px;line-height:1.6}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.primary{background:#f6c76d;color:#172235;border:0;border-radius:12px;padding:13px 18px;font-weight:800}.secondary{background:#24344c;color:white;border:1px solid #53637a;border-radius:12px;padding:13px 18px}.milestone{margin:16px 0;padding:14px;border:1px solid #6d5833;border-radius:15px;background:#302b25;color:#ffe0a1}.meter{height:7px;background:#35445b;border-radius:8px;overflow:hidden;margin:12px 0}.meter span{display:block;height:100%;background:#f6c76d;transition:width .3s}.stats{display:flex;gap:14px;color:#c9ced8;margin:18px 0;font-size:13px}footer{text-align:center;color:#9da9ba;font-size:13px;margin-top:32px}footer a{color:#f6c76d}#notice{min-height:1.5em;color:#f6c76d;font-size:13px}@media(prefers-reduced-motion:no-preference){.card{animation:rise .3s ease}@keyframes rise{from{opacity:.5;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}</style></head><body><main class="shell"><header><div><div class="brand">REVEALED</div><div class="tag">THE STORIES YOU THOUGHT YOU KNEW</div></div><button class="pill" id="daily">Daily mystery</button></header><h1>Think you know the <span class="gold">whole story?</span></h1><p class="sub">Strange events. Ancient mysteries. Real Scripture. Make your guess, uncover the context, and challenge a friend.</p><div class="stats"><span id="progress">0 discovered</span><span id="score">0 correct</span><span id="streak">🔥 0 streak</span></div><div id="journey"></div><nav class="tabs" id="tabs" aria-label="Choose game mode"></nav><section id="game" aria-live="polite"></section><p id="notice" role="status"></p><footer>Curiosity welcome. No account required.<p><a href="https://awemissions.org" target="_blank" rel="noopener">AWE Missions</a> · <a href="https://awemissions.github.io/Awe-faith/" target="_blank" rel="noopener">Awe Faith</a></p></footer></main><script>
const data=[
{id:'donkey',mode:'Bible or Not?',icon:'🐴',title:'The unexpected voice',q:'Which strange event is described in the Bible?',options:['A donkey spoke to its rider','A camel delivered a sermon','A horse wrote a warning'],answer:0,detail:'Numbers 22:21–35 describes Balaam’s donkey speaking after the Lord opened its mouth. This is a biblical narrative, not an independently verified zoological event.',source:'Numbers 22:21–35'},
{id:'axe',mode:'Bible or Not?',icon:'🪓',title:'The impossible rescue',q:'A borrowed tool was lost in the water. What happened next?',options:['An iron axe head floated','A bronze sword turned to gold','A hammer spoke'],answer:0,detail:'2 Kings 6:1–7 describes Elisha causing a borrowed iron axe head to float. The passage presents this as a miracle.',source:'2 Kings 6:1–7'},
{id:'window',mode:'Bible or Not?',icon:'🪟',title:'A very long sermon',q:'What happened during Paul’s late-night teaching?',options:['The building disappeared','A young man fell from a window','A rooster interrupted the crowd'],answer:1,detail:'Acts 20:7–12 describes Eutychus falling from a third-story window and being taken up alive after Paul went down to him.',source:'Acts 20:7–12'},
{id:'fish',mode:'Bible or Not?',icon:'🐟',title:'An unusual way to pay',q:'What unusual instruction did Jesus give Peter?',options:['Find a coin in a fish’s mouth','Ask a bird for silver','Dig beneath an olive tree'],answer:0,detail:'Matthew 17:24–27 records Jesus telling Peter to find a coin in the mouth of the first fish he catches to pay the temple tax.',source:'Matthew 17:24–27'},
{id:'wall',mode:'What Happens Next?',icon:'✋',title:'Writing on the wall',q:'A mysterious hand writes on the wall at Belshazzar’s feast. What happens next?',options:['Daniel interprets the message','The palace turns to stone','The writing disappears and is forgotten'],answer:0,detail:'Daniel 5 says Daniel interprets the writing as judgment on Belshazzar; the chapter says the king was killed that night. Babylon’s fall in 539 BCE is historically documented, though the supernatural writing is a scriptural claim.',source:'Daniel 5'},
{id:'sea',mode:'What Happens Next?',icon:'🌊',title:'Trapped at the sea',q:'The Israelites face the sea with Egyptian forces behind them. What does the account say Moses does?',options:['Builds a fleet','Stretches out his hand over the sea','Returns to Egypt'],answer:1,detail:'Exodus 14 describes Moses stretching out his hand as the Lord drives back the sea. The miraculous crossing is part of the biblical account.',source:'Exodus 14:15–31'},
{id:'jericho',mode:'What Happens Next?',icon:'📯',title:'The seventh day at Jericho',q:'After marching around Jericho, what do the people do?',options:['Shout after the trumpets sound','Build a bridge','Light seven signal fires'],answer:0,detail:'Joshua 6 describes the priests blowing trumpets and the people shouting before the wall falls. Archaeological interpretations of Jericho’s destruction chronology remain debated.',source:'Joshua 6:15–21'},
{id:'storm',mode:'What Happens Next?',icon:'⛵',title:'A storm on the lake',q:'The disciples wake Jesus during a storm. What happens?',options:['They turn back to shore','Jesus rebukes the wind and sea','They abandon the boat'],answer:1,detail:'Mark 4:35–41 says Jesus rebukes the wind and tells the sea to be still, and a great calm follows.',source:'Mark 4:35–41'},
{id:'cyrus',mode:'History Detective',icon:'🏺',title:'A ruler from ancient Persia',q:'Which artifact independently attests to Cyrus the Great and his rule?',options:['The Cyrus Cylinder','The Rosetta Stone','The Dead Sea Scrolls'],answer:0,detail:'The Cyrus Cylinder is a Babylonian royal inscription from the sixth century BCE. It independently documents Cyrus and his imperial policies, but does not specifically confirm the wording of Ezra’s decree.',source:'Ezra 1:1–4; British Museum, Cyrus Cylinder'},
{id:'pilate',mode:'History Detective',icon:'🪨',title:'A name carved in stone',q:'What discovery names Pontius Pilate?',options:['An inscription found at Caesarea','A coin from Athens naming Paul','A tablet from Nineveh naming Peter'],answer:0,detail:'The Pilate Stone, found at Caesarea Maritima in 1961, bears an inscription naming Pontius Pilate. It independently corroborates his historical existence and title.',source:'John 18–19; Pilate Stone, Caesarea'},
{id:'siloam',mode:'History Detective',icon:'💧',title:'A secret beneath the city',q:'Which inscription describes the meeting of tunnel-digging teams?',options:['The Siloam Inscription','The Behistun Inscription','The Mesha Stele'],answer:0,detail:'The Siloam Inscription describes the completion of an ancient water tunnel in Jerusalem. Scholars generally associate the tunnel with the Iron Age; the identification with Hezekiah’s specific project is discussed in scholarship.',source:'2 Kings 20:20; Siloam Inscription'},
{id:'deadsea',mode:'History Detective',icon:'📜',title:'The desert discovery',q:'What are the Dead Sea Scrolls especially important for?',options:['Preserving ancient biblical manuscripts','Recording Roman tax returns','Listing medieval kings'],answer:0,detail:'The Dead Sea Scrolls include biblical manuscripts and other Jewish writings dating from the last centuries BCE and first century CE. They are major evidence for the textual history of the Hebrew Bible.',source:'Dead Sea Scrolls; Israel Antiquities Authority'}];
let sessionAnswered=0,sessionCorrect=0,combo=0;const modes=['For You','Bible or Not?','What Happens Next?','History Detective'];let mode='For You',index=0,selected=null;const key='revealed-progress-v1';let saved;try{saved=JSON.parse(localStorage.getItem(key))||{done:{},correct:{}}}catch{saved={done:{},correct:{}}}const $=s=>document.querySelector(s);function pool(){return mode==='For You'?data:data.filter(x=>x.mode===mode)}function current(){return pool()[index%pool().length]}function persist(){try{localStorage.setItem(key,JSON.stringify(saved))}catch{}}function stats(){$('#progress').textContent=Object.keys(saved.done).length+' discovered';$('#score').textContent=Object.keys(saved.correct).length+' correct';$('#streak').textContent='🔥 '+combo+' streak';const step=sessionAnswered%3;$('#journey').innerHTML='<div class="eyebrow">Discovery round · '+step+'/3</div><div class="meter" aria-label="Round progress '+step+' of 3"><span style="width:'+(step/3*100)+'%"></span></div>'+(sessionAnswered>0&&step===0?'<div class="milestone" role="status">🏆 Round complete! '+sessionCorrect+' correct so far. Keep exploring or challenge a friend.</div>':'')}function render(){const d=current();$('#tabs').innerHTML=modes.map(m=>'<button class="pill '+(m===mode?'active':'')+'" data-mode="'+m+'">'+m+'</button>').join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;index=0;selected=null;render()});$('#game').innerHTML='<article class="card"><div class="cinema" data-scene="'+scene(d)+'"><span class="scene-label">REVEALED · STORY '+(index+1)+'</span><div class="scene" aria-hidden="true">'+d.icon+'</div><div class="hook">'+hook(d)+'</div></div><div class="inner"><div class="eyebrow">'+d.mode+' · '+(index+1)+' / '+pool().length+'</div><h2>'+d.title+'</h2><p class="sub">'+d.q+'</p><div id="answers"></div><div id="reveal"></div><div class="actions"><button class="primary" id="next">Next mystery →</button><button class="secondary" id="share">Share challenge</button></div></div></article>';$('#answers').innerHTML=d.options.map((o,i)=>'<button class="option" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));$('#next').onclick=()=>move(1);$('#previous').onclick=()=>move(-1);$('#random').onclick=()=>move(1+Math.floor(Math.random()*(pool().length-1)));$('#share').onclick=()=>share(d);if(selected!==null)showAnswer(d);stats()}function scene(d){return /sea|axe|fish|siloam/.test(d.id)?'water':/cyrus|deadsea|jericho/.test(d.id)?'desert':'stone'}function hook(d){const hooks={donkey:'What would you do if the impossible spoke?',axe:'One mistake. One borrowed tool. No way to retrieve it.',window:'A late-night gathering takes an unexpected turn.',fish:'An impossible bill. An unusual instruction.',wall:'The celebration stops when a message appears.',sea:'Nowhere to run. Nowhere to hide.',jericho:'An ancient city faces an unlikely strategy.',storm:'A small boat. A terrifying storm.',cyrus:'A clay cylinder opens a window into an empire.',pilate:'One inscription. A name from the Gospels.',siloam:'Two teams dig toward each other in darkness.',deadsea:'Hidden manuscripts change what historians can study.'};return hooks[d.id]||d.title}function move(delta){const n=pool().length;index=(index+delta+n)%n;selected=null;history.replaceState(null,'',location.pathname);render()}let startX=null;document.querySelector('#game').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});document.querySelector('#game').addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;startX=null;if(Math.abs(dx)>85&&!e.target.closest('button'))move(dx<0?1:-1)},{passive:true});function answer(i){if(selected!==null)return;selected=i;const d=current();saved.done[d.id]=true;sessionAnswered++;if(i===d.answer){saved.correct[d.id]=true;sessionCorrect++;combo++}else combo=0;persist();showAnswer(d);stats()}function showAnswer(d){document.querySelectorAll('[data-answer]').forEach(b=>{let i=Number(b.dataset.answer);b.disabled=true;if(i===d.answer)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});$('#reveal').innerHTML='<div class="reveal"><strong>'+(selected===d.answer?'✨ Correct!':'The reveal: '+d.options[d.answer])+'</strong><p>'+d.detail+'</p><small>Source: '+d.source+'</small><p><button class="secondary" id="verse" type="button">Look up the passage ↗</button></p></div>';const verse=document.querySelector('#verse');if(verse)verse.onclick=()=>window.open('https://www.biblegateway.com/passage/?search='+encodeURIComponent(d.source.split(';')[0].replace(/:.*/,m=>m))+'&version=ESV','_blank','noopener')}async function share(d){const url=new URL(location.href);url.searchParams.set('challenge',d.id);const payload={title:'REVEALED: '+d.title,text:'Can you solve this Bible and history mystery?',url:url.href};try{if(navigator.share){await navigator.share(payload);return}if(navigator.clipboard){await navigator.clipboard.writeText(payload.text+' '+payload.url);$('#notice').textContent='Challenge link copied!';return}prompt('Copy this challenge link:',url.href)}catch(e){if(e.name!=='AbortError')$('#notice').textContent='Could not share; copy the page URL instead.'}}$('#daily').onclick=()=>{mode='For You';const day=Math.floor(Date.now()/86400000);index=day%data.length;selected=null;render()};const deep=new URLSearchParams(location.search).get('challenge');if(deep){const i=data.findIndex(x=>x.id===deep);if(i>=0){mode=data[i].mode;index=data.filter(x=>x.mode===mode).findIndex(x=>x.id===deep)}}render();
</script></body></html>
